<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Blaze AI Interview</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(135deg, #111827, #1e3a8a);
    }

    main {
      width: min(640px, 90%);
      padding: 40px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.6;
      color: #dbeafe;
    }
  </style>
</head>

<body>
  <main>
    <h1>Blaze AI Interview</h1>

    <p>
      Buổi phỏng vấn thử dành cho vị trí Fresher AI Engineer,
      thời lượng khoảng mười phút.
    </p>

    <p>
      Nhấn nút ở góc dưới bên phải và cho phép sử dụng
      microphone để bắt đầu.
    </p>
  </main>

  <!-- LiveKit sẽ cung cấp đoạn script này -->
  <script
    src="https://cloud.livekit.io/embed-popup.js"
    data-lk-agent="CA_YOUR_AGENT_ID">
  </script>
</body>
</html>
